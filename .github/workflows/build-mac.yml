name: Build macOS App

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build and Package
        run: |
          npm run build
          npx electron-builder --mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Mac Intel Installer
        uses: actions/upload-artifact@v4
        with:
          name: Control-Asistencia-Mac-Intel
          path: dist/*-mac.dmg
          if-no-files-found: ignore

      - name: Upload Mac Apple Silicon Installer
        uses: actions/upload-artifact@v4
        with:
          name: Control-Asistencia-Mac-AppleSilicon
          path: dist/*-arm64.dmg
          if-no-files-found: ignore
